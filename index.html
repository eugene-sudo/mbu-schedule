<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>團隊行程</title>
<meta name="theme-color" content="#ffffff">
<script>
  /* 先套用上次的主題顏色（dashboard 設定裡選的），打開時不會閃白 */
  try { var t = JSON.parse(localStorage.getItem('mbuShellTheme') || 'null');
        if (t) { document.querySelector('meta[name="theme-color"]').content = t.meta; document.documentElement.style.setProperty('--bg', t.bg); } } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="團隊行程">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#f5f6f8}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1f2328}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:var(--bg)}
  #cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#ecebe6;transition:opacity .3s}   /* 載入畫面：跟 CS LEAVE 一樣的米色 */
  #cover.hide{opacity:0;pointer-events:none}
  #cover img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 28px rgba(11,31,54,.35);animation:bootIn .5s ease-out}
  @keyframes bootIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  #cover .t{font-size:15px;color:#64748b}
  .boot-name{font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:800;font-size:20px;letter-spacing:.12em;color:#0b1f36;margin-bottom:10px}
  .boot-name span{color:#c9a227}
  .spinner{width:32px;height:32px;border:3px solid #e7e2d6;border-top-color:#12304f;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #help{display:none;max-width:300px;text-align:center;font-size:14px;line-height:1.6;color:#6b7280;padding:0 16px}
  #help .main{display:inline-block;margin-top:12px;background:#12304f;color:#fff;border:0;border-radius:999px;padding:11px 26px;font-size:15px;font-weight:600}
  #help a{display:inline-block;margin-top:12px;color:#2563eb;text-decoration:none;font-size:14px}
  #help button{margin-top:8px;border:0;background:none;color:#2563eb;font-size:14px}
</style>
</head>
<body>
<!-- ▼▼▼ 唯一要改的地方：貼上 dashboard 的網址（Apps Script「管理部署作業」裡的網頁應用程式網址） ▼▼▼ -->
<script>const APP_URL = 'https://script.google.com/a/macros/prowavegroup.com/s/AKfycbw6tEZZ8MDqYD8fETENNr3q7TIX53LnaHiWXLIP3u60nGt-PsqqJyVFoVrOVFgaiXIbow/exec';</script>
<!-- ▲▲▲ -------------------------------------------------------------------------------- ▲▲▲ -->

<iframe id="app" allow="clipboard-write" title="團隊行程"></iframe>
<div id="cover">
  <img src="icon-192.png" alt="">
  <div class="boot-name">MBU <span>SCHEDULE</span></div>
  <div class="spinner" id="spin"></div>
  <div class="t" id="msg">載入中…</div>
  <div id="help">
    <span id="helpTxt"></span>
    <br><button class="main" onclick="location.reload()">重新載入</button>
    <br><a id="open" rel="noopener"></a>
  </div>
</div>

<script>
  const f = document.getElementById('app');
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const op = document.getElementById('open');
  op.href = APP_URL;
  if (IOS) {   // iPhone：不嵌入、直接打開 dashboard（同一個視窗），登入不會被擋
    op.textContent = '直接開啟 dashboard ›';
    document.getElementById('helpTxt').innerHTML = '畫面一直沒出來，可能是網路慢，或 iPhone 擋住了 Google 登入。<br>先按「重新載入」；還是不行就按下面的「直接開啟」。';
  } else {
    op.target = '_blank'; op.textContent = '用 Chrome 開啟並登入 ›';
    document.getElementById('helpTxt').innerHTML = '畫面一直沒出來，可能是網路慢，或還沒登入公司 Google 帳號。<br>先按「重新載入」；還是不行就用 Chrome 開一次並登入。';
  }
  f.src = APP_URL;
  let ready = false;
  /* dashboard 載入完成時會傳訊息過來，收到就把載入畫面收起來 */
  window.addEventListener('message', e => {
    if (!/^https:\/\/([a-z0-9-]+\.)*(google\.com|googleusercontent\.com)$/.test(e.origin)) return;
    /* dashboard 換主題：狀態列顏色、背景跟著變，並記住 */
    if (e.data && e.data.mbu === 'theme') {
      document.querySelector('meta[name="theme-color"]').content = e.data.meta;
      document.documentElement.style.setProperty('--bg', e.data.bg);
      try { localStorage.setItem('mbuShellTheme', JSON.stringify({ meta: e.data.meta, bg: e.data.bg })); } catch (x) {}
    }
    /* boot＝dashboard 頁面已打開（已登入）；ready＝資料也載好了。任一個到了就收起載入畫面 */
    if (e.data && (e.data.mbu === 'ready' || e.data.mbu === 'boot') && !ready) {
      ready = true; document.getElementById('cover').classList.add('hide');
    }
  });
  /* 10 秒：提示還在載入；25 秒還沒打開：多半是登入或網路問題，顯示說明 */
  setTimeout(() => { if (!ready) document.getElementById('msg').textContent = '還在載入，網路較慢請稍候…'; }, 10000);
  setTimeout(() => { if (!ready) {
    document.getElementById('msg').style.display = 'none';
    document.getElementById('spin').style.display = 'none';
    document.getElementById('help').style.display = 'block';
  }}, 25000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
